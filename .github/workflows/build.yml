name: build

on:
  # Other branches build through their pull request, so a PR doesn't run everything twice
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call: # release.yml runs these jobs before publishing
    inputs:
      pack-version:
        description: Version shown in the pack's description (defaults to dev-<sha>)
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A new commit on a PR replaces its running build; main and releases always finish
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: PACK_VERSION="${PACK_VERSION:-dev-${GITHUB_SHA::7}}" bun run build
        env:
          PACK_VERSION: ${{ inputs.pack-version }}
      # Downloads as a zip with pack.mcmeta at its root, ready to drop in
      - uses: actions/upload-artifact@v7
        with:
          name: yanvil-datapack
          path: .sandstone/output/datapack
          if-no-files-found: error

  # Boots a 26.3 server with the datapack and fails on any load or runtime error
  load-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PACK: ${{ github.workspace }}/datapack
      WORKDIR: /tmp/yanvil-ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: yanvil-datapack
          path: datapack
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/cache@v6
        with:
          path: /tmp/yanvil-ci/server.jar
          key: server-jar-${{ hashFiles('scripts/lib/server-jar.sh') }}
      - run: scripts/load-test.sh
      # A mock player picks up items and uses the anvil, grindstone, smithing and enchanting tables
      - run: scripts/player-test.sh
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-log
          path: |
            /tmp/yanvil-ci/log.txt
            /tmp/yanvil-ci/run/log.txt

  # Fails if any anvil step would cost 40+ with the tier table
  costs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WORKDIR: /tmp/yanvil-ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: /tmp/yanvil-ci/server.jar
          key: server-jar-${{ hashFiles('scripts/lib/server-jar.sh') }}
      - run: scripts/anvil-costs.sh
